name: Laboe Collection Worker

on:
  workflow_dispatch:
    inputs:
      collection_date:
        description: "Run date to collect, YYYY-MM-DD. Leave blank to use the oldest dashboard request."
        required: false
      target_leads:
        description: "Target leads to collect"
        required: false
        default: "100"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: laboe-collection-worker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collection worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTION_DATE: ${{ github.event.inputs.collection_date }}
          TARGET_LEADS: ${{ github.event.inputs.target_leads }}
        run: |
          export TARGET_LEADS="${TARGET_LEADS:-100}"
          node scripts/laboe_collection_worker.mjs
